name: Build GitCode documentation preview

run-name: "${{ inputs.pr_number && format('Preview GitCode PR #{0}', inputs.pr_number) || 'Deploy GitCode master' }}"

on:
  push:
    branches:
      - main
  schedule:
    # GitHub cron uses UTC.
    - cron: '17 18 * * *'  # 02:17 Asia/Shanghai
    - cron: '17 5 * * *'   # 13:17 Asia/Shanghai
    - cron: '17 10 * * *'  # 18:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'GitCode PR number; leave empty to deploy master'
        required: false
        type: string

env:
  GITCODE_REPOSITORY: https://gitcode.com/cann/asc-devkit.git
  PAGES_CONTENT_BRANCH: pages-content
  MAX_PR_PREVIEWS: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      site_base: ${{ steps.resolve.outputs.site_base }}

    steps:
      - name: Resolve GitCode source
        id: resolve
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            base_ref=master
            base_sha=$(git ls-remote "$GITCODE_REPOSITORY" refs/heads/master | awk '{print $1}')
            base_url=$GITCODE_REPOSITORY
            head_ref=''
            head_url=''
            source_sha=$base_sha
            echo 'mode=master' >> "$GITHUB_OUTPUT"
            echo 'pr_number=' >> "$GITHUB_OUTPUT"
            echo 'source_ref=master' >> "$GITHUB_OUTPUT"
            echo 'site_base=/' >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid GitCode PR number: $PR_NUMBER" >&2
              exit 1
            fi

            pr_json=$(curl --fail --silent --show-error --location \
              "https://api.gitcode.com/api/v5/repos/cann/asc-devkit/pulls/$PR_NUMBER")
            base_ref=$(jq -er '.base.ref' <<< "$pr_json")
            base_sha=$(jq -er '.base.sha' <<< "$pr_json")
            base_url=$(jq -er '.base.repo.html_url' <<< "$pr_json")
            head_ref=$(jq -er '.head.ref' <<< "$pr_json")
            head_sha=$(jq -er '.head.sha' <<< "$pr_json")
            head_url=$(jq -er '.head.repo.html_url' <<< "$pr_json")

            [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$base_url" == https://gitcode.com/* && "$head_url" == https://gitcode.com/* ]]

            source_sha=$head_sha
            echo 'mode=pr' >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "source_ref=PR #$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "site_base=/pr/$PR_NUMBER/" >> "$GITHUB_OUTPUT"
          fi

          [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$base_ref" >/dev/null
          [[ "$base_url" == https://gitcode.com/* ]]
          if [[ -n "$head_ref" ]]; then
            git check-ref-format --branch "$head_ref" >/dev/null
            [[ "$head_url" == https://gitcode.com/* ]]
            commit_repository_url=${head_url%.git}
          else
            commit_repository_url=${base_url%.git}
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_url=$head_url" >> "$GITHUB_OUTPUT"
          echo "commit_repository_url=$commit_repository_url" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Restore GitCode repository cache
        uses: actions/cache@v6
        with:
          path: .gitcode-cache
          key: gitcode-source-v1-${{ runner.os }}-${{ steps.resolve.outputs.base_sha }}-${{ steps.resolve.outputs.source_sha }}
          restore-keys: |
            gitcode-source-v1-${{ runner.os }}-

      - name: Fetch GitCode source
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          HEAD_SHA: ${{ steps.resolve.outputs.source_sha }}
          HEAD_URL: ${{ steps.resolve.outputs.head_url }}
          GIT_LFS_SKIP_SMUDGE: '1'
        shell: bash
        run: |
          set -euo pipefail
          bare_repository="$GITHUB_WORKSPACE/.gitcode-cache/asc-devkit.git"
          lfs_storage="$GITHUB_WORKSPACE/.gitcode-cache/lfs"
          mkdir -p .gitcode-cache

          if [[ -d "$bare_repository/objects" ]]; then
            git --git-dir="$bare_repository" remote set-url origin "$BASE_URL"
            git --git-dir="$bare_repository" fetch --prune --tags origin \
              "+refs/heads/$BASE_REF:refs/heads/$BASE_REF"
          else
            git clone --bare --single-branch --branch "$BASE_REF" \
              "$BASE_URL" "$bare_repository"
          fi

          git clone --no-checkout "$bare_repository" source
          git -C source remote set-url origin "$BASE_URL"
          git -C source checkout --detach "$BASE_SHA"

          if [[ -n "${PR_NUMBER:-}" ]]; then
            git -C source remote add preview "$HEAD_URL"
            git -C source fetch --no-tags preview "refs/heads/$HEAD_REF"
            fetched_head=$(git -C source rev-parse FETCH_HEAD)
            if [[ "$fetched_head" != "$HEAD_SHA" ]]; then
              echo "GitCode PR head changed while resolving the preview" >&2
              exit 1
            fi
            git -C source -c user.name='GitHub Pages Preview' \
              -c user.email='actions@github.com' merge --no-edit --no-ff "$HEAD_SHA"
          fi

          unset GIT_LFS_SKIP_SMUDGE
          git -C source lfs install --local
          git -C source config lfs.storage "$lfs_storage"
          lfs_failed=0
          git -C source lfs fetch origin "$BASE_REF" --include='docs/**' || lfs_failed=1
          if [[ -n "${PR_NUMBER:-}" ]]; then
            git -C source lfs fetch preview "$HEAD_REF" --include='docs/**' || lfs_failed=1
          fi
          git -C source lfs checkout || lfs_failed=1
          if [[ "$lfs_failed" == '1' ]]; then
            echo '::warning::Some Git LFS documentation objects are unavailable; the build will continue with pointer files.'
          fi

      - name: Add CI build configuration
        env:
          BUILD_MODE: ${{ steps.resolve.outputs.mode }}
          COMMIT_REPOSITORY_URL: ${{ steps.resolve.outputs.commit_repository_url }}
        working-directory: source/docs/zh/vitepress
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^packages:' pnpm-workspace.yaml 2>/dev/null; then
            {
              printf '%s\n' 'packages:' "  - '.'" ''
              [[ ! -f pnpm-workspace.yaml ]] || cat pnpm-workspace.yaml
            } > pnpm-workspace.yaml.tmp
            mv pnpm-workspace.yaml.tmp pnpm-workspace.yaml
          fi

          node <<'NODE'
          const fs = require('node:fs')
          const file = 'docs/.vitepress/config.mjs'
          const before = fs.readFileSync(file, 'utf8')
          const after = before.replace(
            "dirty: Boolean(runGit(['status', '--porcelain', '--untracked-files=no'])),",
            'dirty: false,',
          )
          if (!after.includes('dirty: false,')) {
            throw new Error(`CI build metadata patch did not match ${file}`)
          }
          if (after !== before) fs.writeFileSync(file, after)
          NODE

          if [[ "$BUILD_MODE" == 'pr' ]]; then
            node <<'NODE'
          const fs = require('node:fs')

          function updateFile(file, transform, verify) {
            const before = fs.readFileSync(file, 'utf8')
            const after = transform(before)
            if (!verify(after)) throw new Error(`Preview path patch did not match ${file}`)
            if (after !== before) fs.writeFileSync(file, after)
          }

          updateFile('docs/.vitepress/config.mjs', (source) => {
            let updated = source
            if (!updated.includes("base: process.env.DOCS_BASE || '/'")) {
              updated = updated.replace(
                'export default defineConfig({',
                "export default defineConfig({\n  base: process.env.DOCS_BASE || '/',",
              )
            }
            updated = updated.replace(
              '=> `href="/${type}/${path}.html${hash || \'\'}"`',
              '=> `href="${process.env.DOCS_BASE || \'/\'}${type}/${path}.html${hash || \'\'}"`',
            )
            return updated
          }, source => source.includes("base: process.env.DOCS_BASE || '/'")
            && source.includes('dirty: false,'))

          updateFile('docs/.vitepress/theme/Search.vue', source => source.replace(
            "import('/pagefind/pagefind.js')",
            'import(/* @vite-ignore */ `${import.meta.env.BASE_URL}pagefind/pagefind.js`)',
          ), source => source.includes('BASE_URL}pagefind/pagefind.js'))

          updateFile('docs/.vitepress/theme/ApiDownload.vue', source => source.replace(
            "fetch('/api-source/bundle.json')",
            'fetch(`${import.meta.env.BASE_URL}api-source/bundle.json`)',
          ), source => source.includes('BASE_URL}api-source/bundle.json'))

          updateFile('docs/.vitepress/theme/DocumentBuildInfo.vue', source => source.replace(
            'https://gitcode.com/cann/asc-devkit/commit/',
            `${process.env.COMMIT_REPOSITORY_URL}/commit/`,
          ), source => source.includes(`${process.env.COMMIT_REPOSITORY_URL}/commit/`))

          updateFile('docs/.vitepress/theme/pagefind-search.mjs', (source) => {
            let updated = source
            if (!updated.includes('const ASC_PREVIEW_BASE =')) {
              const marker = "const TITLE_INDEX_SOURCE = 'title-route'"
              updated = updated.replace(
                marker,
                `${marker}\nconst ASC_PREVIEW_BASE = typeof import.meta.env === 'object' ? import.meta.env.BASE_URL : '/'`,
              )
            }
            updated = updated.replace(
              /fetch\('\/search-identifiers\.json([^']*)'/,
              (_, suffix) => `fetch(\`\${ASC_PREVIEW_BASE}search-identifiers.json${suffix}\``,
            )
            updated = updated.replace(
              "pagefind.mergeIndex('/pagefind-titles/',",
              'pagefind.mergeIndex(`${ASC_PREVIEW_BASE}pagefind-titles/`,',
            )
            return updated
          }, source => source.includes('ASC_PREVIEW_BASE}search-identifiers.json')
            && source.includes('ASC_PREVIEW_BASE}pagefind-titles/'))
          NODE
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/docs/zh/vitepress/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: source/docs/zh/vitepress/requirements.txt

      - name: Install dependencies
        working-directory: source/docs/zh/vitepress
        run: |
          python -m pip install -r requirements.txt
          pnpm install --frozen-lockfile

      - name: Build VitePress and Pagefind
        working-directory: source/docs/zh/vitepress
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          BUILD_MODE: ${{ steps.resolve.outputs.mode }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          COMMIT_REPOSITORY_URL: ${{ steps.resolve.outputs.commit_repository_url }}
          DOCS_BASE: ${{ steps.resolve.outputs.site_base }}
          DOCS_COMMIT: ${{ steps.resolve.outputs.source_sha }}
          DOCS_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          build_started_ms=$(date +%s%3N)
          pnpm run docs:prebuild
          pnpm exec vitepress build docs
          build_finished_ms=$(date +%s%3N)
          export BUILD_DURATION_MS=$((build_finished_ms - build_started_ms))
          export BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const root = 'docs/.vitepress/dist'
          const imageExtensions = new Set(['.avif', '.gif', '.ico', '.jpeg', '.jpg', '.png', '.svg', '.webp'])
          const searchExtensions = new Set(['.pagefind', '.pf_fragment', '.pf_index', '.pf_meta'])
          const stats = {
            totalBytes: 0,
            fileCount: 0,
            directoryCount: 0,
            pageCount: 0,
            pageBytes: 0,
            imageCount: 0,
            imageBytes: 0,
            imageTypes: {},
            jsCount: 0,
            jsBytes: 0,
            cssCount: 0,
            cssBytes: 0,
            searchCount: 0,
            searchBytes: 0,
            otherCount: 0,
            otherBytes: 0,
            otherTypes: {},
          }

          function scan(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name)
              if (entry.isDirectory()) {
                stats.directoryCount += 1
                scan(file)
                continue
              }
              if (!entry.isFile()) continue

              const bytes = fs.statSync(file).size
              const extension = path.extname(entry.name).toLowerCase()
              stats.fileCount += 1
              stats.totalBytes += bytes
              if (extension === '.html') {
                stats.pageCount += 1
                stats.pageBytes += bytes
              } else if (imageExtensions.has(extension)) {
                const type = extension.slice(1).toUpperCase()
                stats.imageCount += 1
                stats.imageBytes += bytes
                stats.imageTypes[type] ??= { count: 0, bytes: 0 }
                stats.imageTypes[type].count += 1
                stats.imageTypes[type].bytes += bytes
              } else if (extension === '.js' || extension === '.mjs') {
                stats.jsCount += 1
                stats.jsBytes += bytes
              } else if (extension === '.css') {
                stats.cssCount += 1
                stats.cssBytes += bytes
              } else if (searchExtensions.has(extension)) {
                stats.searchCount += 1
                stats.searchBytes += bytes
              } else {
                const type = extension ? extension.slice(1).toUpperCase() : 'NO EXTENSION'
                stats.otherCount += 1
                stats.otherBytes += bytes
                stats.otherTypes[type] ??= { count: 0, bytes: 0 }
                stats.otherTypes[type].count += 1
                stats.otherTypes[type].bytes += bytes
              }
            }
          }

          scan(root)
          const metadata = {
            schemaVersion: 2,
            mode: process.env.BUILD_MODE,
            prNumber: process.env.PR_NUMBER || null,
            ref: process.env.DOCS_REF,
            sha: process.env.DOCS_COMMIT,
            commitUrl: `${process.env.COMMIT_REPOSITORY_URL}/commit/${process.env.DOCS_COMMIT}`,
            builtAt: process.env.BUILT_AT,
            buildDurationMs: Number(process.env.BUILD_DURATION_MS),
            stats,
          }
          fs.writeFileSync(path.join(root, '_build-info.json'), `${JSON.stringify(metadata, null, 2)}\n`)
          NODE

      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-${{ github.run_id }}
          path: source/docs/zh/vitepress/docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download generated site
        uses: actions/download-artifact@v8
        with:
          name: generated-site-${{ github.run_id }}
          path: incoming

      - name: Load current Pages snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          git -C published init
          git -C published remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C published fetch --depth=1 origin "$PAGES_CONTENT_BRANCH"; then
            git -C published checkout --detach FETCH_HEAD
          fi

      - name: Update Pages snapshot
        env:
          BUILD_MODE: ${{ needs.build.outputs.mode }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BUILD_MODE" == 'master' ]]; then
            # Refresh the root site while retaining active PR previews.
            rsync -a --delete --exclude '/.git/' --exclude '/pr/' \
              --exclude '/_build-history/' incoming/ published/
          else
            preview_dir="published/pr/$PR_NUMBER"
            rm -rf "$preview_dir"
            mkdir -p "$preview_dir"
            rsync -a --delete incoming/ "$preview_dir/"
          fi

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const previewRoot = 'published/pr'
          const statusRoot = 'published/status'
          const historyRoot = 'published/_build-history'
          const historyFile = path.join(historyRoot, 'master.json')
          const limit = Number(process.env.MAX_PR_PREVIEWS)
          fs.mkdirSync(previewRoot, { recursive: true })
          fs.mkdirSync(statusRoot, { recursive: true })
          fs.mkdirSync(historyRoot, { recursive: true })

          const escapeHtml = value => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')

          const readJson = (file) => {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf8'))
            } catch {
              return null
            }
          }

          const formatBytes = (bytes) => {
            if (!Number.isFinite(bytes)) return '-'
            const units = ['B', 'KiB', 'MiB', 'GiB']
            let value = bytes
            let unit = 0
            while (value >= 1024 && unit < units.length - 1) {
              value /= 1024
              unit += 1
            }
            const digits = unit === 0 || value >= 100 ? 0 : value >= 10 ? 1 : 2
            return `${value.toFixed(digits)} ${units[unit]}`
          }

          const formatDuration = (milliseconds) => {
            if (!Number.isFinite(milliseconds)) return '-'
            const seconds = Math.round(milliseconds / 1000)
            const minutes = Math.floor(seconds / 60)
            return minutes ? `${minutes}m ${seconds % 60}s` : `${seconds}s`
          }

          const formatBuiltAt = (value) => {
            if (!value) return '-'
            const date = new Date(value)
            if (Number.isNaN(date.getTime())) return String(value)
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false,
            }).formatToParts(date).map(({ type, value: part }) => [type, part]))
            return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`
          }

          const metric = (value) => Number.isFinite(value) ? value.toLocaleString('en-US') : '-'
          const assetMetric = (count, bytes) => Number.isFinite(count)
            ? `${metric(count)} / ${formatBytes(bytes)}`
            : '-'
          const imageDetails = (types) => types && Object.entries(types).length
            ? Object.entries(types)
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([type, data]) => `${type}: ${metric(data.count)} / ${formatBytes(data.bytes)}`)
              .join('; ')
            : 'No image details'
          const otherDetails = (types) => types && Object.entries(types).length
            ? Object.entries(types)
              .sort(([, left], [, right]) => right.bytes - left.bytes)
              .map(([type, data]) => `${type}: ${metric(data.count)} / ${formatBytes(data.bytes)}`)
              .join('; ')
            : 'No other file details'

          const previews = fs.readdirSync(previewRoot, { withFileTypes: true })
            .filter(entry => entry.isDirectory() && /^\d+$/.test(entry.name))
            .map((entry) => {
              const directory = path.join(previewRoot, entry.name)
              const current = readJson(path.join(directory, '_build-info.json'))
              const legacy = readJson(path.join(directory, '.preview.json'))
              const metadata = current || legacy
              return metadata && {
                directory,
                number: metadata.prNumber || metadata.number || entry.name,
                ...metadata,
              }
            })
            .filter(Boolean)
            .sort((left, right) => right.builtAt.localeCompare(left.builtAt))

          for (const preview of previews.slice(limit)) {
            fs.rmSync(preview.directory, { recursive: true, force: true })
          }

          const active = previews.slice(0, limit)
            .sort((left, right) => Number(right.number) - Number(left.number))
          const master = readJson('published/_build-info.json')
          const existingHistory = readJson(historyFile)
          const historyByDate = new Map()
          for (const record of Array.isArray(existingHistory) ? existingHistory : []) {
            const date = formatBuiltAt(record.builtAt).slice(0, 10)
            const previous = historyByDate.get(date)
            if (/^\d{4}-\d{2}-\d{2}$/.test(date)
              && (!previous || record.builtAt > previous.builtAt)) {
              historyByDate.set(date, record)
            }
          }
          if (process.env.BUILD_MODE === 'master' && master?.builtAt) {
            const date = formatBuiltAt(master.builtAt).slice(0, 10)
            const previous = historyByDate.get(date)
            if (!previous || master.builtAt > previous.builtAt) historyByDate.set(date, master)
          }
          const history = [...historyByDate.entries()]
            .sort(([, left], [, right]) => right.builtAt.localeCompare(left.builtAt))
            .map(([date, record]) => ({ ...record, historyDate: date }))
          fs.writeFileSync(historyFile, `${JSON.stringify(history, null, 2)}\n`)

          const currentBuilds = [
            { ...(master || {}), label: 'master', href: '../' },
            ...active.map(preview => ({
              ...preview,
              label: `PR #${preview.number}`,
              href: `../pr/${preview.number}/`,
            })),
          ]
          const historyBuilds = history.map(record => ({
            ...record,
            label: `master ${record.historyDate}`,
          }))
          const renderRow = (build) => {
            const stats = build.stats || {}
            const source = build.href
              ? `<a href="${escapeHtml(build.href)}">${escapeHtml(build.label)}</a>`
              : escapeHtml(build.label)
            return `
            <tr>
              <td>${source}</td>
              <td>${build.sha ? `<a href="${escapeHtml(build.commitUrl || `https://gitcode.com/cann/asc-devkit/commit/${build.sha}`)}"><code>${escapeHtml(build.sha.slice(0, 12))}</code></a>` : '-'}</td>
              <td>${formatBytes(stats.totalBytes)}</td>
              <td>${metric(stats.fileCount)}</td>
              <td>${metric(stats.directoryCount)}</td>
              <td>${assetMetric(stats.pageCount, stats.pageBytes)}</td>
              <td title="${escapeHtml(imageDetails(stats.imageTypes))}">${assetMetric(stats.imageCount, stats.imageBytes)}</td>
              <td>${assetMetric(stats.jsCount, stats.jsBytes)}</td>
              <td>${assetMetric(stats.cssCount, stats.cssBytes)}</td>
              <td>${assetMetric(stats.searchCount, stats.searchBytes)}</td>
              <td title="${escapeHtml(otherDetails(stats.otherTypes))}">${assetMetric(stats.otherCount, stats.otherBytes)}</td>
              <td>${formatDuration(build.buildDurationMs)}</td>
              <td><time datetime="${escapeHtml(build.builtAt || '')}">${escapeHtml(formatBuiltAt(build.builtAt))}</time></td>
            </tr>`
          }
          const currentRows = currentBuilds.map(renderRow).join('')
          const historyRows = historyBuilds.length ? `
            <tr class="history-separator"><th colspan="13">Master daily history</th></tr>
            ${historyBuilds.map(renderRow).join('')}` : ''
          const rows = currentRows + historyRows
          const emptyRow = '<tr><td colspan="13">No build information is available yet.</td></tr>'
          fs.writeFileSync(path.join(statusRoot, 'index.html'), `<!doctype html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ascend C documentation status</title>
          <style>body{font:15px system-ui;margin:40px auto;max-width:1600px;padding:0 20px;color:#24292f}.table-wrap{overflow-x:auto;border:1px solid #d0d7de;border-radius:6px}table{border-collapse:collapse;width:100%;min-width:1420px}th,td{border-bottom:1px solid #d0d7de;padding:11px 12px;text-align:left;white-space:nowrap}th{background:#f6f8fa;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:not(.history-separator):hover{background:#f6f8fa}.history-separator th{border-top:3px solid #8c959f;padding-top:14px;font-size:14px}a{color:#0969da;font-weight:600}code{font-size:13px}p{color:#57606a}</style></head>
          <body><h1>Ascend C documentation status</h1><p>Published master and GitCode PR preview artifacts. Asset cells show count / size; hover over Images or Other for details. Build times are UTC+8.</p><div class="table-wrap"><table><thead><tr><th>Source</th><th>Commit</th><th>Total size</th><th>Files</th><th>Directories</th><th>Pages</th><th>Images</th><th>JavaScript</th><th>CSS</th><th>Search index</th><th>Other</th><th>Build time</th><th>Built at (UTC+8)</th></tr></thead><tbody>${rows || emptyRow}</tbody></table></div></body></html>`)

          fs.writeFileSync(path.join(previewRoot, 'index.html'), `<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="refresh" content="0; url=../status/"><link rel="canonical" href="../status/"><title>Ascend C documentation status</title></head><body><p><a href="../status/">Open documentation status</a></p></body></html>`)
          NODE

          if [[ ! -f published/index.html ]]; then
            cp published/pr/index.html published/index.html
          fi

          touch published/.nojekyll

      - name: Save Pages snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ needs.build.outputs.mode }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          git -C published add -A
          tree=$(git -C published write-tree)
          message="deploy GitCode master"
          if [[ "$BUILD_MODE" == 'pr' ]]; then
            message="deploy GitCode PR #$PR_NUMBER"
          fi
          commit=$(printf '%s\n' "$message" | git -C published \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree")
          git -C published push --force origin \
            "$commit:refs/heads/$PAGES_CONTENT_BRANCH"

      - name: Prepare Pages artifact
        run: rsync -a --exclude '/.git/' published/ deploy-site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add preview URL to summary
        if: needs.build.outputs.mode == 'pr'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
        run: printf '### Preview URL\n%s/pr/%s/\n' "${PAGE_URL%/}" "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
